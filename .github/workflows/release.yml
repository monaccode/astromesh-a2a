name: Release
on:
  push:
    tags: ["v*"]
  # Re-run a release from main, e.g. to put an already-published version on TestPyPI.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # TestPyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for pyproject.toml (the version)
      - uses: astral-sh/setup-uv@v6
      - name: Install from TestPyPI and import it
        run: |
          VERSION="$(uv version --short)"
          uv venv -q /tmp/smoke
          export VIRTUAL_ENV=/tmp/smoke
          # The package only from TestPyPI (--no-deps), its dependencies from PyPI.
          # TestPyPI indexes with a delay, so retry; `ok` makes a run that never
          # succeeds fail here instead of passing on the last `sleep`.
          for _ in 1 2 3 4 5 6; do
            uv pip install -q --no-deps --index-url https://test.pypi.org/simple/ \
              "astromesh-a2a==${VERSION}" && ok=1 && break
            echo "astromesh-a2a==${VERSION} not on TestPyPI yet; retrying in 30s"
            sleep 30
          done
          test "${ok:-}" = 1 || { echo "::error::astromesh-a2a==${VERSION} never became installable from TestPyPI"; exit 1; }
          uv pip install -q "a2a-sdk>=1.2,<2" "httpx>=0.27" "pyyaml>=6.0"
          cd /tmp && /tmp/smoke/bin/python -c "import astromesh_a2a; print(astromesh_a2a.__version__)"
      - name: Serve and call an agent with the published package (examples/hello_local.py)
        run: |
          export VIRTUAL_ENV=/tmp/smoke
          # The server extra's dependencies, from PyPI.
          uv pip install -q "a2a-sdk[http-server]>=1.2,<2" "starlette>=0.40" "uvicorn>=0.30"
          # Run from /tmp so the installed package is imported, not the checkout.
          cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/examples/hello_local.py"

  pypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
